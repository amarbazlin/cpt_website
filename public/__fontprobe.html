<!doctype html>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" />
<div id="out">pending</div>
<script>
  const probe = (w) => "bold " + w + " 16px Inter, monospace";
  document.fonts.ready.then(() => {
    const c = document.createElement("canvas").getContext("2d");
    const widthOf = (font) => { c.font = font; return c.measureText("Hardware 0123").width; };
    const results = {
      loaded: document.fonts.status,
      inter400: document.fonts.check("400 16px Inter"),
      inter500: document.fonts.check("500 16px Inter"),
      inter600: document.fonts.check("600 16px Inter"),
      inter700: document.fonts.check("700 16px Inter"),
      inter800: document.fonts.check("800 16px Inter"),
      // If Inter truly renders, each weight must measure a DIFFERENT width
      // than the generic monospace fallback.
      widths: {
        fallback: widthOf("bold 16px monospace"),
        w400: widthOf("400 16px Inter, monospace"),
        w500: widthOf("500 16px Inter, monospace"),
        w600: widthOf("600 16px Inter, monospace"),
        w700: widthOf("700 16px Inter, monospace"),
        w800: widthOf("800 16px Inter, monospace"),
      },
    };
    const w = results.widths;
    results.distinctFromFallback =
      [w.w400, w.w500, w.w600, w.w700, w.w800].every((x) => Math.abs(x - w.fallback) > 0.5);
    document.getElementById("out").textContent = "RESULT" + JSON.stringify(results) + "ENDRESULT";
  });
</script>
